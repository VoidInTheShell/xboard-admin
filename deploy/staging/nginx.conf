server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the Compose service at request time so the static frontend can
    # start independently while the Xboard backend is still coming up.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"xboard-admin"}';
    }

    location ^~ /api/ {
        set $xboard_backend http://xboard-app:7001;
        proxy_pass $xboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /storage/ {
        set $xboard_backend http://xboard-app:7001;
        proxy_pass $xboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Theme sends only the current secure path here. Strip that one path segment
    # so a single relative-asset build can serve every administrator entry.
    location ~ ^/[^/]+/assets/ {
        rewrite ^/[^/]+/(.*)$ /xboard-admin/$1 break;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/[^/]+$ {
        return 308 $uri/;
    }

    location ~ ^/[^/]+/ {
        rewrite ^/[^/]+/(.*)$ /xboard-admin/$1 break;
        try_files $uri $uri/ /xboard-admin/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        return 404;
    }
}
