name: Build and Publish Admin

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: voidintheshell/xboard-admin

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, build and smoke-test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build standalone administrator assets
        env:
          VITE_BASE_PATH: /unitedearthgov/
        run: npm run build

      - name: Validate administrator asset base
        run: |
          set -Eeuo pipefail
          grep --fixed-strings '<title>XBoard Admin</title>' dist/index.html > /dev/null
          grep --fixed-strings 'data-xboard-admin-shell="standalone"' dist/index.html > /dev/null
          grep -R --fixed-strings '/unitedearthgov/assets/' dist/index.html dist/assets > /dev/null

      - name: Build and validate runtime image
        run: |
          set -Eeuo pipefail
          docker build --build-arg VITE_BASE_PATH=/unitedearthgov/ --tag xboard-admin-ci:${GITHUB_SHA} .
          docker run --rm xboard-admin-ci:${GITHUB_SHA} nginx -t
          container="xboard-admin-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --detach --name "${container}" --publish 127.0.0.1:18080:80 xboard-admin-ci:${GITHUB_SHA}
          trap 'docker rm --force "${container}" >/dev/null 2>&1 || true' EXIT
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:18080/healthz > /dev/null
          admin_page=$(mktemp)
          curl --fail --silent --show-error http://127.0.0.1:18080/unitedearthgov > "${admin_page}"
          grep --fixed-strings '<title>XBoard Admin</title>' "${admin_page}" > /dev/null
          grep --fixed-strings 'data-xboard-admin-shell="standalone"' "${admin_page}" > /dev/null
          grep --fixed-strings '/unitedearthgov/assets/' "${admin_page}" > /dev/null
          js_path=$(grep -oE '/unitedearthgov/assets/[^" ]+\.js' "${admin_page}" | head -n 1)
          test -n "${js_path}"
          js_type=$(curl --fail --silent --show-error --output /dev/null --write-out '%{content_type}' "http://127.0.0.1:18080${js_path}")
          case "${js_type}" in
            application/javascript*|text/javascript*) ;;
            *) echo "Unexpected administrator JavaScript content type" >&2; exit 1 ;;
          esac
          css_path=$(grep -oE '/unitedearthgov/assets/[^" ]+\.css' "${admin_page}" | head -n 1 || true)
          if [ -n "${css_path}" ]; then
            css_type=$(curl --fail --silent --show-error --output /dev/null --write-out '%{content_type}' "http://127.0.0.1:18080${css_path}")
            case "${css_type}" in
              text/css*) ;;
              *) echo "Unexpected administrator stylesheet content type" >&2; exit 1 ;;
            esac
          fi

  build-and-push:
    name: Publish multi-architecture image
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BASE_PATH=/unitedearthgov/
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
