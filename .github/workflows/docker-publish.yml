name: Build and Publish Admin

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Formal version (vX.Y.Z); publish only, never deploy. Empty keeps the transitional workflow."
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: voidintheshell/xboard-admin
  UPDATER_IMAGE_NAME: voidintheshell/xboard-admin-updater

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-admin:
    name: Lint, build and smoke-test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build standalone administrator assets
        env:
          VITE_BASE_PATH: /unitedearthgov/
        run: npm run build

      - name: Validate administrator asset base
        run: |
          set -Eeuo pipefail
          grep --fixed-strings '<title>XBoard Admin</title>' dist/index.html > /dev/null
          grep --fixed-strings 'data-xboard-admin-shell="standalone"' dist/index.html > /dev/null
          grep --fixed-strings '/unitedearthgov/assets/' dist/index.html > /dev/null
          ! grep --fixed-strings './assets/' dist/index.html > /dev/null

      - name: Build and validate runtime image
        run: |
          set -Eeuo pipefail
          docker build --build-arg VITE_BASE_PATH=/unitedearthgov/ --tag xboard-admin-ci:${GITHUB_SHA} .
          docker run --rm xboard-admin-ci:${GITHUB_SHA} nginx -t
          container="xboard-admin-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --detach --name "${container}" --publish 127.0.0.1:18080:80 xboard-admin-ci:${GITHUB_SHA}
          trap 'docker rm --force "${container}" >/dev/null 2>&1 || true' EXIT
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:18080/healthz > /dev/null
          admin_page=$(mktemp)
          curl --fail --silent --show-error http://127.0.0.1:18080/unitedearthgov/ > "${admin_page}"
          grep --fixed-strings '<title>XBoard Admin</title>' "${admin_page}" > /dev/null
          grep --fixed-strings 'data-xboard-admin-shell="standalone"' "${admin_page}" > /dev/null
          grep --fixed-strings '/unitedearthgov/assets/' "${admin_page}" > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/standalone-admin-smoke/ | grep --fixed-strings 'data-xboard-admin-shell="standalone"' > /dev/null
          deep_page=$(mktemp)
          curl --fail --silent --show-error 'http://127.0.0.1:18080/unitedearthgov/servers/1/routing?instance=1' > "${deep_page}"
          grep --fixed-strings '<title>XBoard Admin</title>' "${deep_page}" > /dev/null
          grep --fixed-strings '/unitedearthgov/assets/' "${deep_page}" > /dev/null
          js_path=$(grep -oE '/unitedearthgov/assets/[^" ]+\.js' "${admin_page}" | head -n 1)
          test -n "${js_path}"
          js_type=$(curl --fail --silent --show-error --output /dev/null --write-out '%{content_type}' "http://127.0.0.1:18080${js_path}")
          case "${js_type}" in
            application/javascript*|text/javascript*) ;;
            *) echo "Unexpected administrator JavaScript content type" >&2; exit 1 ;;
          esac
          css_path=$(grep -oE '\./assets/[^" ]+\.css' "${admin_page}" | head -n 1 | sed 's#^\./#/#' || true)
          if [ -n "${css_path}" ]; then
            css_type=$(curl --fail --silent --show-error --output /dev/null --write-out '%{content_type}' "http://127.0.0.1:18080/unitedearthgov${css_path}")
            case "${css_type}" in
              text/css*) ;;
              *) echo "Unexpected administrator stylesheet content type" >&2; exit 1 ;;
            esac
          fi

  test-updater:
    name: Test standalone updater
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: updater/go.mod

      - name: Run updater tests
        working-directory: updater
        run: |
          go test ./...
          go vet ./...
          go build -trimpath ./cmd/xboard-updater

      - name: Run updater handoff recovery tests as root
        working-directory: updater
        # The Run-path recovery tests exercise secureOwner state chains that
        # only exist for a root-owned directory hierarchy.
        run: sudo "$(which go)" test ./internal/updater/ -run 'TestRun(RecoversExpiredWedgedHandoff|RetiresSupersededExecutorQuietly)' -count=1 -v


  prepare-release:
    name: Freeze version and release plan
    if: github.event_name != 'pull_request'
    needs: [test-admin, test-updater]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      plan_artifact: release-plan-${{ steps.plan.outputs.version }}
      checkout_ref: ${{ steps.plan.outputs.checkout_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Prepare exact version
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 .github/scripts/release.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-plan-${{ steps.plan.outputs.version }}
          overwrite: true
          path: ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error
          retention-days: 30

  build-admin-image:
    name: Publish multi-architecture Admin image
    if: github.event_name != 'pull_request'
    needs: [test-admin, test-updater, prepare-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Verify checkout and load frozen plan
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.prepare-release.outputs.plan_artifact }}
          path: ${{ runner.temp }}
      - name: Preserve an already built version on retry
        id: existing-image
        run: python3 .github/scripts/release.py image-check

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare-release.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        if: steps.existing-image.outputs.exists != 'true'
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.prepare-release.outputs.version }}
            VITE_BASE_PATH=/unitedearthgov/
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Report staging image tag
        env:
          IMAGE_TAG: ${{ needs.prepare-release.outputs.version }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Published staging image: ${image}"
          printf 'Staging image: `%s`\n' "${image}" >> "$GITHUB_STEP_SUMMARY"

  build-updater-artifacts:
    name: Publish updater image and binaries
    if: github.event_name != 'pull_request'
    needs: [test-admin, test-updater, prepare-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}

      - name: Set build time
        id: build-time
        shell: bash
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen release plan
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.prepare-release.outputs.plan_artifact }}
          path: ${{ runner.temp }}

      - name: Generate updater image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.UPDATER_IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare-release.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Check whether updater image already exists
        id: existing-image
        run: python3 .github/scripts/release.py updater-image-check

      - name: Build and push updater image
        if: steps.existing-image.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: updater
          file: updater/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare-release.outputs.version }}
            BUILD_TIME=${{ steps.build-time.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Set up Go for release binaries
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: updater/go.mod

      - name: Build and verify updater binaries
        working-directory: updater
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          BUILD_TIME: ${{ steps.build-time.outputs.value }}
        run: |
          set -Eeuo pipefail
          output_dir="${RUNNER_TEMP}/updater-binaries"
          mkdir -p "${output_dir}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/VoidInTheShell/xboard-admin/updater/internal/updater.BuildVersionValue=${VERSION} -X github.com/VoidInTheShell/xboard-admin/updater/internal/updater.BuildTimeValue=${BUILD_TIME}" \
              -o "${output_dir}/xboard-updater-linux-${arch}" ./cmd/xboard-updater
          done
          chmod 0755 "${output_dir}"/xboard-updater-linux-*
          file "${output_dir}"/xboard-updater-linux-*
          "${output_dir}/xboard-updater-linux-amd64" version | grep -F -- "${VERSION}"
          test -s "${output_dir}/xboard-updater-linux-amd64"
          test -s "${output_dir}/xboard-updater-linux-arm64"

      - name: Upload updater binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updater-binaries-${{ needs.prepare-release.outputs.version }}
          path: ${{ runner.temp }}/updater-binaries/xboard-updater-linux-*
          if-no-files-found: error
          retention-days: 30

  deploy-staging:
    name: Update GJHK standalone admin
    # Paused while upgrades are validated through the panel-owned updater.
    if: >-
      false &&
      inputs.release_version == '' &&
      startsWith(github.ref, 'refs/heads/') &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/dev')
      )
    needs: build-admin-image
    runs-on: ubuntu-latest
    concurrency:
      group: staging-${{ github.repository_id }}
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ vars.STAGING_PANEL_URL }}
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
      SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
      SSH_USER: ${{ vars.STAGING_SSH_USER }}
      PANEL_URL: ${{ vars.STAGING_PANEL_URL }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ADMIN_IMAGE: ghcr.io/voidintheshell/xboard-admin:${{ needs.build-admin-image.outputs.image_tag }}
      REMOTE_BUNDLE: /home/beihai/docker/.incoming/xboard-admin-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate staging configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_HOST:?STAGING_SSH_HOST is required}"
          : "${SSH_PORT:?STAGING_SSH_PORT is required}"
          : "${SSH_USER:?STAGING_SSH_USER is required}"
          : "${PANEL_URL:?STAGING_PANEL_URL is required}"
          : "${SSH_PRIVATE_KEY:?STAGING_SSH_PRIVATE_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?STAGING_SSH_KNOWN_HOSTS is required}"
          [[ "${ADMIN_IMAGE}" =~ ^ghcr\.io/voidintheshell/xboard-admin:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]

      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          install -d -m 700 "${SSH_DIR}"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${SSH_DIR}/id_ed25519"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${SSH_DIR}/known_hosts"

      - name: Upload and deploy standalone admin
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          SSH_TARGET="${SSH_USER}@${SSH_HOST}"
          SSH_ARGS=(-i "${SSH_DIR}/id_ed25519" -p "${SSH_PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${SSH_DIR}/known_hosts")
          SCP_ARGS=(-i "${SSH_DIR}/id_ed25519" -P "${SSH_PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${SSH_DIR}/known_hosts")

          ssh "${SSH_ARGS[@]}" "${SSH_TARGET}" "install -d -m 700 '${REMOTE_BUNDLE}'"
          scp "${SCP_ARGS[@]}" deploy/staging/update-admin.sh "${SSH_TARGET}:${REMOTE_BUNDLE}/update-admin.sh"
          printf '%s\n' "${GHCR_TOKEN}" | ssh "${SSH_ARGS[@]}" "${SSH_TARGET}" "chmod 700 '${REMOTE_BUNDLE}/update-admin.sh' && '${REMOTE_BUNDLE}/update-admin.sh' '${ADMIN_IMAGE}' '${GITHUB_ACTOR}'"

      - name: Verify active public standalone admin when the stack exists
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          SSH_TARGET="${SSH_USER}@${SSH_HOST}"
          SSH_ARGS=(-i "${SSH_DIR}/id_ed25519" -p "${SSH_PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${SSH_DIR}/known_hosts")
          stack_present=$(ssh "${SSH_ARGS[@]}" "${SSH_TARGET}" "test -f /home/beihai/docker/xboard/compose.yaml && printf present || true")
          if [ "${stack_present}" != "present" ]; then
            echo "Standalone admin image cached; the three-container stack has not been installed yet."
            exit 0
          fi
          active_path=$(ssh "${SSH_ARGS[@]}" "${SSH_TARGET}" "sudo -n docker exec xboard-theme cat /var/run/xboard-admin-route/active-path")
          [[ "${active_path}" =~ ^[A-Za-z0-9_-]{8,}$ && "${active_path}" != "passport" ]]
          admin_page=$(mktemp)
          trap 'rm -f -- "${admin_page}"' EXIT
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${PANEL_URL}/${active_path}/" > "${admin_page}"
          grep --fixed-strings '<title>XBoard Admin</title>' "${admin_page}" > /dev/null
          grep --fixed-strings 'data-xboard-admin-shell="standalone"' "${admin_page}" > /dev/null

      - name: Remove deployment bundle
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          if [ -f "${SSH_DIR}/id_ed25519" ] && [ -n "${SSH_HOST:-}" ] && [ -n "${REMOTE_BUNDLE:-}" ]; then
            ssh -i "${SSH_DIR}/id_ed25519" -p "${SSH_PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${SSH_DIR}/known_hosts" "${SSH_USER}@${SSH_HOST}" "case '${REMOTE_BUNDLE}' in /home/beihai/docker/.incoming/xboard-admin-*) rm -rf -- '${REMOTE_BUNDLE}' ;; *) exit 1 ;; esac"
          fi
          rm -rf -- "${SSH_DIR}"

  deploy-production:
    name: Update JPGREEN production admin
    # Keep recovery implementation without deploying from CI.
    if: >-
      false &&
      inputs.release_version == '' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-admin-image
    runs-on: ubuntu-latest
    concurrency:
      group: production-${{ github.repository_id }}
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_PANEL_URL }}
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
      SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
      PANEL_URL: ${{ vars.PRODUCTION_PANEL_URL }}
      ADMIN_PATH: ${{ vars.PRODUCTION_ADMIN_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ADMIN_IMAGE: ghcr.io/voidintheshell/xboard-admin:${{ needs.build-admin-image.outputs.image_tag }}
    steps:
      - name: Validate production configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_HOST:?PRODUCTION_SSH_HOST is required}"
          : "${SSH_PORT:?PRODUCTION_SSH_PORT is required}"
          : "${SSH_USER:?PRODUCTION_SSH_USER is required}"
          : "${PANEL_URL:?PRODUCTION_PANEL_URL is required}"
          : "${ADMIN_PATH:?PRODUCTION_ADMIN_PATH is required}"
          : "${DEPLOY_SSH_KEY:?PRODUCTION_DEPLOY_SSH_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?PRODUCTION_SSH_KNOWN_HOSTS is required}"
          test "${PANEL_URL}" = 'https://panel.uegov.org'
          test "${ADMIN_PATH}" = 'unitedearthgov'
          test "${SSH_USER}" = 'xboard-ci'
          [[ "${ADMIN_IMAGE}" =~ ^ghcr\.io/voidintheshell/xboard-admin:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]

      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          install -d -m 700 "${SSH_DIR}"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${SSH_DIR}/id_ed25519"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${SSH_DIR}/known_hosts"

      - name: Deploy production admin through the forced command
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          SSH_TARGET="${SSH_USER}@${SSH_HOST}"
          SSH_ARGS=(-i "${SSH_DIR}/id_ed25519" -p "${SSH_PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${SSH_DIR}/known_hosts")
          printf '%s\n' "${GHCR_TOKEN}" | ssh "${SSH_ARGS[@]}" "${SSH_TARGET}" \
            "deploy-admin ${GITHUB_SHA} ${ADMIN_IMAGE} ${GITHUB_ACTOR}"

      - name: Verify public theme and protected runtime from JPGREEN
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          SSH_TARGET="${SSH_USER}@${SSH_HOST}"
          SSH_ARGS=(-i "${SSH_DIR}/id_ed25519" -p "${SSH_PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${SSH_DIR}/known_hosts")
          ssh "${SSH_ARGS[@]}" "${SSH_TARGET}" verify-production

      - name: Remove the ephemeral deploy identity
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          rm -rf -- "${SSH_DIR}"

  release:
    name: Publish complete version
    needs: [prepare-release, build-admin-image, build-updater-artifacts]
    if: needs.prepare-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.prepare-release.outputs.plan_artifact }}
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: updater-binaries-${{ needs.prepare-release.outputs.version }}
          path: release-binaries
      - name: Publish only after every required artifact is ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/scripts/release.py complete --assets release-binaries
